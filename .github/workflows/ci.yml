name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings -A dead_code
