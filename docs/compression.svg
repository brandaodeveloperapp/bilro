<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Forty commit lines print, then fade away one by one until only the line reporting a failure remains, and a counter climbs to 98 percent smaller.">
<style>
  .bg { fill: #16151a; }
  .bar { fill: #1d1c22; }
  .t { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .p { fill: #b98adf; }
  .c { fill: #dcd9e3; }
  .o { fill: #6f6b7a; }
  .f { fill: #e08b78; }
  .g { fill: #7bc496; }
  .s { font: 11px ui-sans-serif, system-ui, sans-serif; fill: #57535f; }

  .cmd { opacity: 0; animation: appear 12s infinite; }
  @keyframes appear { 0% { opacity: 0 } 3% { opacity: 1 } 100% { opacity: 1 } }

  .l { opacity: 0; animation: life 12s infinite; }
  @keyframes life {
    0%, 5%   { opacity: 0 }
    9%       { opacity: 1 }
    46%      { opacity: 1 }
    58%      { opacity: 0 }
    100%     { opacity: 0 }
  }

  .keep { opacity: 0; animation: kept 12s infinite; }
  @keyframes kept {
    0%, 5%  { opacity: 0 }
    9%      { opacity: 1 }
    100%    { opacity: 1 }
  }

  .rise { opacity: 0; animation: rise 12s infinite; }
  @keyframes rise {
    0%, 58% { opacity: 0; transform: translateY(6px) }
    66%     { opacity: 1; transform: translateY(0) }
    94%     { opacity: 1; transform: translateY(0) }
    100%    { opacity: 0; transform: translateY(0) }
  }

  .l:nth-of-type(1)  { animation-delay: 0s }
  .l:nth-of-type(2)  { animation-delay: .05s }
  .l:nth-of-type(3)  { animation-delay: .1s }
  .l:nth-of-type(4)  { animation-delay: .15s }
  .l:nth-of-type(5)  { animation-delay: .2s }
  .l:nth-of-type(6)  { animation-delay: .3s }
  .l:nth-of-type(7)  { animation-delay: .35s }
  .l:nth-of-type(8)  { animation-delay: .4s }
  .l:nth-of-type(9)  { animation-delay: .45s }
  .l:nth-of-type(10) { animation-delay: .5s }
  .l:nth-of-type(11) { animation-delay: .55s }
  .l:nth-of-type(12) { animation-delay: .6s }
  .l:nth-of-type(13) { animation-delay: .65s }
</style>

  <rect class="bg" width="720" height="400" rx="10"/>
  <rect class="bar" width="720" height="32" rx="10"/>
  <rect class="bar" y="22" width="720" height="10"/>
  <circle cx="20" cy="16" r="5" fill="#e08b78"/>
  <circle cx="38" cy="16" r="5" fill="#dfc07a"/>
  <circle cx="56" cy="16" r="5" fill="#7bc496"/>

  <text class="t cmd" x="20" y="64"><tspan class="p">$</tspan> <tspan class="c">bilro filter git log --oneline -40</tspan></text>

  <g>
    <text class="t o l" x="20" y="96">d14b684 Land the coverage work</text>
    <text class="t o l" x="20" y="118">04c1f7f Drop the redundant index</text>
    <text class="t o l" x="20" y="140">b429599 Capture attribution at signup</text>
    <text class="t o l" x="20" y="162">9944f67 Return consumed stock on cancel</text>
    <text class="t o l" x="20" y="184">2f81aa0 Split the settlement report</text>
    <text class="t f keep" x="20" y="206">2945d6b Alert when prod health fails</text>
    <text class="t o l" x="20" y="228">7c30e19 Move the queue behind a flag</text>
    <text class="t o l" x="20" y="250">e5b0c44 Rename the delivery stage</text>
    <text class="t o l" x="20" y="272">1a9f8d2 Backfill the missing invoices</text>
    <text class="t o l" x="20" y="294">c7e441b Tighten the tenant scope</text>
    <text class="t o l" x="20" y="316">3d2b90f Drop the unused migration</text>
    <text class="t o l" x="20" y="338">8ae1c56 Cache the price table</text>
    <text class="t o l" x="20" y="360">a4e90d1 … and twenty-seven more</text>
  </g>

  <text class="t g rise" x="20" y="252">98% smaller — 39 repeated lines</text>
  <text class="s rise" x="20" y="278">the one that stayed is the one reporting a failure</text>
</svg>
