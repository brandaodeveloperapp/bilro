<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="A memory file carrying a malicious verify line is refused three ways: shell syntax, an interpreter as the program, and git configured to run a shell alias.">
<style>
  .bg { fill: #16151a; }
  .chrome { fill: #1d1c22; }
  .t { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .prompt { fill: #b98adf; }
  .cmd { fill: #dcd9e3; }
  .dim { fill: #837e91; }
  .bad { fill: #e08b78; }
  .good { fill: #7bc496; }
  .label { font: 11px ui-sans-serif, system-ui, sans-serif; fill: #837e91; }
  .head { font: 11px ui-sans-serif, system-ui, sans-serif; fill: #b98adf; }
  .box { fill: #1d1c22; stroke: #2e2c37; }

  .a { animation: sa 12s infinite; }
  .b { animation: sb 12s infinite; opacity: 0; }
  @keyframes sa { 0%,44% { opacity: 1; } 49%,100% { opacity: 0; } }
  @keyframes sb { 0%,47% { opacity: 0; } 52%,96% { opacity: 1; } 100% { opacity: 0; } }
</style>

  <rect class="bg" width="760" height="330" rx="10"/>
  <rect class="chrome" width="760" height="30" rx="10"/>
  <rect class="chrome" y="20" width="760" height="10"/>
  <text class="label" x="16" y="20">a memory file is data, and data does not get to run</text>

  <g class="a">
    <text class="head" x="20" y="58">a memory dropped into the folder</text>
    <rect class="box" x="20" y="70" width="720" height="120" rx="6"/>
    <text class="t dim" x="34" y="92">---</text>
    <text class="t dim" x="34" y="112">name: looks-harmless</text>
    <text class="t" x="34" y="132"><tspan class="dim">verify: </tspan><tspan class="bad">id &gt; /tmp/pwned; echo ok</tspan></text>
    <text class="t dim" x="34" y="152">expect: ok</text>
    <text class="t dim" x="34" y="172">---</text>

    <text class="label" x="20" y="222">A memory is a markdown file. Anyone who can write one</text>
    <text class="label" x="20" y="242">could once have it executed — a penetration test planted exactly</text>
    <text class="label" x="20" y="262">this, and it ran, and reported a green check.</text>
  </g>

  <g class="b">
    <text class="head" x="20" y="58">what happens now</text>
    <text class="t" x="20" y="86"><tspan class="prompt">$</tspan> <tspan class="cmd">bilro verify --run</tspan></text>

    <text class="t" x="20" y="120"><tspan class="bad">refused</tspan>  <tspan class="dim">id &gt; /tmp/pwned; echo ok</tspan></text>
    <text class="label" x="90" y="138">shell syntax, coming from a data file</text>

    <text class="t" x="20" y="168"><tspan class="bad">refused</tspan>  <tspan class="dim">sh -c "touch /tmp/pwned"</tspan></text>
    <text class="label" x="90" y="186">no metacharacter at all — the program itself is a shell</text>

    <text class="t" x="20" y="216"><tspan class="bad">refused</tspan>  <tspan class="dim">git -c alias.x='!touch /tmp/pwned' x</tspan></text>
    <text class="label" x="90" y="234">git is allowed, but an alias beginning with ! runs through a shell</text>

    <text class="t" x="20" y="264"><tspan class="good">ok</tspan>       <tspan class="dim">git rev-parse HEAD</tspan></text>
    <text class="label" x="90" y="282">a read-only subcommand of a vouched-for program</text>

    <text class="label" x="20" y="314">Nothing runs without --run. No shell is ever involved.</text>
  </g>
</svg>
