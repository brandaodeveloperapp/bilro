<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Five lines carrying secrets in different formats go in; the same five come out with only the credential replaced, host and parameters still readable.">
<style>
  .bg { fill: #16151a; }
  .chrome { fill: #1d1c22; }
  .t { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .prompt { fill: #b98adf; }
  .cmd { fill: #dcd9e3; }
  .keep { fill: #837e91; }
  .secret { fill: #e08b78; }
  .mask { fill: #7bc496; }
  .label { font: 11px ui-sans-serif, system-ui, sans-serif; fill: #837e91; }
  .head { font: 11px ui-sans-serif, system-ui, sans-serif; fill: #b98adf; }

  .before { animation: showBefore 9s infinite; }
  .after  { animation: showAfter 9s infinite; opacity: 0; }

  @keyframes showBefore {
    0%, 45% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }
  @keyframes showAfter {
    0%, 45% { opacity: 0; }
    50%, 95% { opacity: 1; }
    100% { opacity: 0; }
  }
</style>

  <rect class="bg" width="760" height="300" rx="10"/>
  <rect class="chrome" width="760" height="30" rx="10"/>
  <rect class="chrome" y="20" width="760" height="10"/>
  <text class="label" x="16" y="20">credentials never reach the conversation, and never reach the database</text>

  <g class="before">
    <text class="head" x="20" y="58">what the command printed</text>
    <text class="t" x="20" y="84"><tspan class="keep">DATABASE_URL=postgres://app:</tspan><tspan class="secret">s3nh4Sup3rS3cr3t</tspan><tspan class="keep">@db:5432/prod</tspan></text>
    <text class="t" x="20" y="106"><tspan class="keep">SERVICE=https://api.example.com/v1?apikey=</tspan><tspan class="secret">sk_live_9f2a71c4</tspan></text>
    <text class="t" x="20" y="128"><tspan class="keep">Authorization: Bearer </tspan><tspan class="secret">eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxIn0.sig</tspan></text>
    <text class="t" x="20" y="150"><tspan class="keep">BASIC=Basic </tspan><tspan class="secret">dXNlcjpwYXNz</tspan></text>
    <text class="t" x="20" y="172"><tspan class="keep">psql --password=</tspan><tspan class="secret">S3nh4Outra</tspan><tspan class="keep"> --host=db.local</tspan></text>

    <text class="label" x="20" y="216">Five formats. Not one of the field names admits to holding a secret —</text>
    <text class="label" x="20" y="236">which is why masking by field name let every one of these through.</text>
    <text class="label" x="20" y="268">What is inspected is the shape of the value.</text>
  </g>

  <g class="after">
    <text class="head" x="20" y="58">what bilro passed on</text>
    <text class="t" x="20" y="84"><tspan class="keep">DATABASE_URL=postgres://app:</tspan><tspan class="mask">***REDACTED***</tspan><tspan class="keep">@db:5432/prod</tspan></text>
    <text class="t" x="20" y="106"><tspan class="keep">SERVICE=https://api.example.com/v1?apikey=</tspan><tspan class="mask">***REDACTED***</tspan></text>
    <text class="t" x="20" y="128"><tspan class="keep">Authorization: Bearer </tspan><tspan class="mask">***REDACTED***</tspan></text>
    <text class="t" x="20" y="150"><tspan class="keep">BASIC=Basic </tspan><tspan class="mask">***REDACTED***</tspan></text>
    <text class="t" x="20" y="172"><tspan class="keep">psql --password=</tspan><tspan class="mask">***REDACTED***</tspan><tspan class="keep"> --host=db.local</tspan></text>

    <text class="label" x="20" y="216">The host, the database, the query parameter beside the key,</text>
    <text class="label" x="20" y="236">the word Bearer — all still readable. Only the credential is gone.</text>
    <text class="label" x="20" y="268">Redacted before it is printed, and before it is written to disk.</text>
  </g>
</svg>
