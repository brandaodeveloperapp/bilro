<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" aria-label="Four things are recorded during the work and returned by bilro recall in a later session.">
<style>
  .bg{fill:#16151a}.bar{fill:#1d1c22}
  .t{font:13px ui-monospace,SFMono-Regular,Menlo,monospace}
  .p{fill:#b98adf}.c{fill:#dcd9e3}.o{fill:#6f6b7a}
  .kind{font:10px ui-monospace,Menlo,monospace}
  .n{font:11px ui-sans-serif,system-ui,sans-serif;fill:#57535f}
  .req{fill:#7bc496}.fail{fill:#e08b78}.warn{fill:#dfc07a}.ag{fill:#b98adf}
  .rec{opacity:0;animation:rec 10s infinite}
  @keyframes rec{0%{opacity:0}8%,42%{opacity:1}50%,100%{opacity:0}}
  .rec:nth-of-type(1){animation-delay:0s}
  .rec:nth-of-type(2){animation-delay:.5s}
  .rec:nth-of-type(3){animation-delay:1s}
  .rec:nth-of-type(4){animation-delay:1.5s}
  .later{opacity:0;animation:later 10s infinite}
  @keyframes later{0%,50%{opacity:0}58%,95%{opacity:1}100%{opacity:0}}
</style>
<rect class="bg" width="720" height="250" rx="10"/>
<rect class="bar" width="720" height="32" rx="10"/><rect class="bar" y="22" width="720" height="10"/>
<circle cx="20" cy="16" r="5" fill="#e08b78"/><circle cx="38" cy="16" r="5" fill="#dfc07a"/><circle cx="56" cy="16" r="5" fill="#7bc496"/>

<g class="rec"><text class="kind req" x="20" y="72">request</text><text class="t o" x="110" y="72">fix the spinner stuck on the orders screen</text></g>
<g class="rec"><text class="kind fail" x="20" y="100">failure</text><text class="t o" x="110" y="100">FAIL src/auth.test.ts — token expiry</text></g>
<g class="rec"><text class="kind ag" x="20" y="128">agent</text><text class="t o" x="110" y="128">security review — two tenant leaks</text></g>
<g class="rec"><text class="kind warn" x="20" y="156">rejected</text><text class="t o" x="110" y="156">not Tauri — it is a webview too</text></g>
<text class="n rec" x="20" y="200">nobody typed any of this</text>

<g class="later">
  <text class="t" x="20" y="72"><tspan class="p">$</tspan> <tspan class="c">bilro recall spinner</tspan></text>
  <text class="kind req" x="20" y="108">request</text><text class="t o" x="110" y="108">fix the spinner stuck on the orders screen</text>
  <text class="kind fail" x="20" y="136">failure</text><text class="t o" x="110" y="136">FAIL src/auth.test.ts — token expiry</text>
  <text class="kind warn" x="20" y="164">rejected</text><text class="t o" x="110" y="164">not Tauri — it is a webview too</text>
  <text class="n" x="20" y="206">a week later, a new session</text>
</g>
</svg>
