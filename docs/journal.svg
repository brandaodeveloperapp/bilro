<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="A session ends and a new one begins; bilro recall returns what was asked for, what failed, and what was decided, so nobody has to repeat themselves.">
<style>
  .bg { fill: #16151a; }
  .chrome { fill: #1d1c22; }
  .t { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .prompt { fill: #b98adf; }
  .cmd { fill: #dcd9e3; }
  .out { fill: #dcd9e3; }
  .dim { fill: #837e91; }
  .fail { fill: #e08b78; }
  .warn { fill: #dfc07a; }
  .good { fill: #7bc496; }
  .label { font: 11px ui-sans-serif, system-ui, sans-serif; fill: #837e91; }
  .head { font: 11px ui-sans-serif, system-ui, sans-serif; fill: #b98adf; }
  .kind { font: 10px ui-monospace, Menlo, monospace; }

  .a { animation: sa 11s infinite; }
  .b { animation: sb 11s infinite; opacity: 0; }

  @keyframes sa { 0%,42% { opacity: 1; } 47%,100% { opacity: 0; } }
  @keyframes sb { 0%,45% { opacity: 0; } 50%,96% { opacity: 1; } 100% { opacity: 0; } }
</style>

  <rect class="bg" width="760" height="320" rx="10"/>
  <rect class="chrome" width="760" height="30" rx="10"/>
  <rect class="chrome" y="20" width="760" height="10"/>
  <text class="label" x="16" y="20">what happened here, so a resumed session need not ask</text>

  <g class="a">
    <text class="head" x="20" y="58">during the work — nobody types any of this</text>

    <text class="t" x="20" y="90"><tspan class="dim">you asked</tspan>  <tspan class="out">fix the spinner stuck on the orders screen</tspan></text>
    <text class="t" x="20" y="116"><tspan class="dim">a command failed</tspan>  <tspan class="fail">FAIL src/auth.test.ts — token expiry</tspan></text>
    <text class="t" x="20" y="142"><tspan class="dim">an agent finished</tspan>  <tspan class="out">security review — two tenant leaks</tspan></text>
    <text class="t" x="20" y="168"><tspan class="dim">you vetoed</tspan>  <tspan class="warn">not Tauri — it is a webview too</tspan></text>

    <text class="label" x="20" y="212">The first three a hook can see. The fourth it cannot:</text>
    <text class="label" x="20" y="232">that an approach was ruled out is a judgement, not a tool call.</text>
    <text class="label" x="20" y="252">It is recorded deliberately, the moment it is made.</text>
    <text class="label" x="20" y="284">Everything is redacted before it is written — a prompt is exactly</text>
    <text class="label" x="20" y="300">where a pasted credential turns up.</text>
  </g>

  <g class="b">
    <text class="head" x="20" y="58">a week later, a new session</text>
    <text class="t" x="20" y="86"><tspan class="prompt">$</tspan> <tspan class="cmd">bilro recall spinner</tspan></text>

    <text class="kind good" x="20" y="120">request</text>
    <text class="t out" x="100" y="120">fix the spinner stuck on the orders screen</text>

    <text class="kind fail" x="20" y="146">failure</text>
    <text class="t dim" x="100" y="146">FAIL src/auth.test.ts — token expiry</text>

    <text class="kind warn" x="20" y="172">rejected</text>
    <text class="t dim" x="100" y="172">not Tauri — it is a webview too</text>

    <text class="label" x="20" y="216">Filed per project, searchable by term or as a plain timeline.</text>
    <text class="label" x="20" y="236">Without it, the next session re-proposes what was already vetoed</text>
    <text class="label" x="20" y="256">and asks you to explain the constraint again.</text>
  </g>
</svg>
