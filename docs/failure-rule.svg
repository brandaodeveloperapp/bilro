<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" role="img" aria-label="A build prints four lines every run; three fade away and the compiler error stays.">
<style>
  .bg{fill:#16151a}.bar{fill:#1d1c22}
  .t{font:13px ui-monospace,SFMono-Regular,Menlo,monospace}
  .p{fill:#b98adf}.c{fill:#dcd9e3}.o{fill:#6f6b7a}.f{fill:#e08b78}
  .n{font:11px ui-sans-serif,system-ui,sans-serif;fill:#57535f}
  .noise{animation:drop 9s infinite}
  @keyframes drop{0%,5%{opacity:0}12%,45%{opacity:1}58%,100%{opacity:0}}
  .stay{opacity:0;animation:stay 9s infinite}
  @keyframes stay{0%,5%{opacity:0}12%,100%{opacity:1}}
  .why{opacity:0;animation:why 9s infinite}
  @keyframes why{0%,60%{opacity:0}70%,94%{opacity:1}100%{opacity:0}}
  .noise:nth-of-type(1){animation-delay:0s}
  .noise:nth-of-type(2){animation-delay:.1s}
  .noise:nth-of-type(3){animation-delay:.2s}
</style>
<rect class="bg" width="720" height="230" rx="10"/>
<rect class="bar" width="720" height="32" rx="10"/><rect class="bar" y="22" width="720" height="10"/>
<circle cx="20" cy="16" r="5" fill="#e08b78"/><circle cx="38" cy="16" r="5" fill="#dfc07a"/><circle cx="56" cy="16" r="5" fill="#7bc496"/>
<text class="t" x="20" y="64"><tspan class="p">$</tspan> <tspan class="c">bilro filter go build ./...</tspan></text>
<text class="t o noise" x="20" y="96">compiling module cache</text>
<text class="t o noise" x="20" y="118">resolving dependencies</text>
<text class="t f stay" x="20" y="140">./main.go:10:2: undefined: fooBar</text>
<text class="t o noise" x="20" y="162">build finished with errors</text>
<text class="n why" x="20" y="200">it repeats in every run, exactly like the lines that vanished</text>
</svg>
