<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="A repository-wide scan produces sixty thousand lines; the snippet that reads them prints four, and only those four enter the conversation.">
<style>
  .bg { fill: #16151a; }
  .chrome { fill: #1d1c22; }
  .t { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .prompt { fill: #b98adf; }
  .cmd { fill: #dcd9e3; }
  .out { fill: #dcd9e3; }
  .dim { fill: #837e91; }
  .flood { fill: #2e2c37; font: 9px ui-monospace, Menlo, monospace; }
  .good { fill: #7bc496; }
  .label { font: 11px ui-sans-serif, system-ui, sans-serif; fill: #837e91; }
  .head { font: 11px ui-sans-serif, system-ui, sans-serif; fill: #b98adf; }
  .box { fill: none; stroke: #2e2c37; }

  .a { animation: sa 10s infinite; }
  .b { animation: sb 10s infinite; opacity: 0; }
  @keyframes sa { 0%,42% { opacity: 1; } 47%,100% { opacity: 0; } }
  @keyframes sb { 0%,45% { opacity: 0; } 50%,96% { opacity: 1; } 100% { opacity: 0; } }
</style>

  <rect class="bg" width="760" height="300" rx="10"/>
  <rect class="chrome" width="760" height="30" rx="10"/>
  <rect class="chrome" y="20" width="760" height="10"/>
  <text class="label" x="16" y="20">derive the answer where the data is, not where the conversation is</text>

  <g class="a">
    <text class="head" x="20" y="58">without it — every byte lands in the context window</text>
    <text class="t" x="20" y="86"><tspan class="prompt">$</tspan> <tspan class="cmd">grep -rn "useState" src/</tspan></text>
    <g class="flood">
      <text x="20" y="110">src/features/orders/OrderList.tsx:14:  const [open, setOpen] = useState(false)</text>
      <text x="20" y="122">src/features/orders/OrderList.tsx:15:  const [page, setPage] = useState(1)</text>
      <text x="20" y="134">src/features/orders/OrderDetail.tsx:9:  const [tab, setTab] = useState("info")</text>
      <text x="20" y="146">src/features/deliveries/List.tsx:22:  const [filter, setFilter] = useState(null)</text>
      <text x="20" y="158">src/features/deliveries/Detail.tsx:31: const [busy, setBusy] = useState(false)</text>
      <text x="20" y="170">src/core/ui/Sheet.tsx:12:  const [height, setHeight] = useState(0)</text>
      <text x="20" y="182">src/core/ui/Table.tsx:44:  const [sort, setSort] = useState("asc")</text>
      <text x="20" y="194">src/core/state/query-store.ts:61: const [runs, setRuns] = useState({})</text>
      <text x="20" y="206">… 60 000 more lines, every one of them counted against the rest of the session</text>
    </g>
    <text class="label" x="20" y="248">You wanted a count. You paid for the whole tree.</text>
  </g>

  <g class="b">
    <text class="head" x="20" y="58">with it — the snippet reads the tree, you read the answer</text>
    <text class="t" x="20" y="86"><tspan class="prompt">$</tspan> <tspan class="cmd">bilro_script — count the hooks per feature</tspan></text>

    <rect class="box" x="20" y="98" width="720" height="58" rx="6"/>
    <text class="t dim" x="32" y="118">for (const f of walk("src")) tally[feature(f)] += hooks(f)</text>
    <text class="t dim" x="32" y="138">console.log(top(tally, 4))</text>

    <text class="t good" x="20" y="182">orders      41</text>
    <text class="t good" x="20" y="200">deliveries  28</text>
    <text class="t good" x="20" y="218">core/ui     19</text>
    <text class="t good" x="20" y="236">notifications 7</text>

    <text class="label" x="20" y="272">Four lines entered the conversation. The sixty thousand never did.</text>
  </g>
</svg>
