[package]
name = "bilro"
version = "0.2.0"
edition = "2021"
description = "Token economy for coding agents: learns what your commands print, keeps only what informs"
license = "MIT"

[[bin]]
name = "bilro"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
sha1 = "0.10"
serde_json = "1"
once_cell = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
